# Замените example.com на свой домен. TLS настраивается certbot:
#   certbot --nginx -d example.com
server {
  listen 80;
  server_name example.com;

  # Интерфейс собирается в статику, API живёт за тем же доменом.
  root /opt/florasklad/artifacts/flower-stock/dist/public;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Одностраничное приложение: любой путь отдаёт index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

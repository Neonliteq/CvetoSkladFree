<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the mobile shell use the full screen; the
         layout keeps its own padding away from the notch and home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5c1f36" />
    <!--
      Тема применяется до загрузки приложения.

      Без этого при перезагрузке в тёмной теме успевала отрисоваться светлая
      страница и только потом темнела — на планшете в зале это выглядит как
      мигание. Скрипт читает тот же ключ, что и переключатель темы
      (`florasklad-theme`), и ставит класс на <html> сразу.

      Значения хранилища те же, что у next-themes: light | dark | system.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('florasklad-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
          var theme = stored === 'light' || stored === 'dark' ? stored : system;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          // Приватный режим или отключённое хранилище: остаётся светлая тема.
        }
      })();
    </script>
    <title>Цветочный склад</title>
    <meta
      name="description"
      content="Внутренняя система цветочного магазина: остатки, партии, свежесть, приход по фото накладной и голосовой помощник."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Цветочный склад" />
    <meta
      property="og:description"
      content="Остатки, партии, свежесть, приход по фото накладной и голосовой помощник."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Цветочный склад" />
    <meta
      name="twitter:description"
      content="Остатки, партии, свежесть, приход по фото накладной и голосовой помощник."
    />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ФлораСклад" />
    <!--
      Шрифт отдаётся с нашего же сервера (пакет @fontsource, подключён в index.css).
      Раньше здесь была ссылка на Google Fonts: лишний внешний запрос, задержка первого
      экрана и шрифт, которого нет в офлайн-кеше PWA.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
